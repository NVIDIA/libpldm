# gcovr configuration file
# Filters for files authored by nvidia.com contributors
# Generated automatically by generate-nvidia-gcovr.sh

filter = include/libpldm/base\.h
filter = include/libpldm/bios\.h
filter = include/libpldm/bios_table\.h
filter = include/libpldm/entity\.h
filter = include/libpldm/firmware_update\.h
filter = include/libpldm/fru\.h
filter = include/libpldm/instance-id\.h
filter = include/libpldm/oem/nvidia/energy_count_numeric_sensor_oem\.h
filter = include/libpldm/oem/nvidia/state_set_oem_nvidia\.h
filter = include/libpldm/pdr\.h
filter = include/libpldm/platform\.h
filter = include/libpldm/pldm\.h
filter = include/libpldm/pldm_types\.h
filter = include/libpldm/state_set\.h
filter = include/libpldm/states\.h
filter = include/libpldm/transport/af-mctp\.h
filter = include/libpldm/transport\.h
filter = include/libpldm/transport/mctp-demux\.h
filter = include/libpldm/utils\.h
filter = src/api\.h
filter = src/compiler\.h
filter = src/dsp/base\.h
filter = src/mctp-defines\.h
filter = src/msgbuf\.h
filter = src/msgbuf/platform\.h
filter = src/responder\.h
filter = src/transport/container-of\.h
filter = src/transport/socket\.h
filter = src/transport/test\.h
filter = src/transport/transport\.h
exclude = tests/.*

html = yes
print-summary = yes

# Exclude compiler-generated exception-handling branches (e.g. copy/move
# constructors of std containers) that are not reachable in normal code paths.
exclude-throw-branches = yes

# Exclude branches in lines that are not reachable (compiler dead code).
exclude-unreachable-branches = yes

# Exclude all lines that contain assert from coverage
exclude-lines-by-pattern = ^\s*assert\s*\(

# Exclude the always-inline PDR iterator guard branches. The iter_next guard
# (!iter->entries / iter->current_index >= iter->total_count) is dead through
# the foreach API because iter_end short-circuits the same condition first, so
# each inline instance keeps a permanently-uncovered outcome that no test can
# reach without adding an equal count of already-covered branches.
exclude-branches-by-pattern = .*(!iter->entries|iter->current_index >= iter->total_count).*
